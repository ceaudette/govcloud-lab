---
- name: Ensure sshd_config.d drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Apply STIG sshd configuration
  ansible.builtin.template:
    src: stig-hardening.conf.j2
    dest: "{{ ssh_dropin_path }}"
    owner: root
    group: root
    mode: '0600'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart sshd
